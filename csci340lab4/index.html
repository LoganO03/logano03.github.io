<!DOCTYPE html>
<html>
    <head>
        <title>Coffee and Facts</title>

        <header>
            <div class="container">
                <div class="row">
                    <h1 class="col-lg-12">Coffee and Random Facts</h1>
                </div>
            </div>
        </header>
        <div class="row">
            <div class="col-lg-6">
                <button id="fact-button" class="btn btn-primary btn-lg">Get Random Fact</button>

        <div class="row">
            <div class="col-lg-6">
                <button id="coffee-button" class="btn btn-primary btn-lg">Get Coffee Pic</button>
                <br><br>
                <img class="coffee-img" src="" alt="Random coffee" style="max-width: 100%; display: none;">
            </div>
        </div>

            </div>
        </div>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
