<!DOCTYPE html>
<html>
    <head>
        <title>Coffee and Facts</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link href="style.css" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Montaga&family=Nabla&family=Piedra&family=Press+Start+2P&family=Trade+Winds&family=Turret+Road:wght@200;300;400;500;700;800&display=swap" rel="stylesheet">
        <style>
            body {
                font-family: "Montaga", sans-serif;
            }
        </style>
    </head>
    <body>

        <header>
            <div class="container">
                    <h1>Coffee & Facts</h1>
                    <img src="photos/coffeecup.png" alt="Coffee Cup">
            </div>
        </header>

        <div class="container">
            <div class="card">
                <h2>Take some Facts...</h2>
                <button id="fact-button" class="btn btn-coffee">Get Random Fact</button>
                <p class="fact"></p>
            </div>

            <div class="card">
                <h2>With your coffee!</h2>
                <button id="coffee-button" class="btn btn-coffee">Get Coffee Pic</button>
                <img class="coffee-img" src="" alt="Random coffee">
            </div>

        </div>

        <footer>
            CoffeeAPI | UselessFacts API
        </footer>

        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
        <script src="script.js"></script>
    </body>
</html>
