<!DOCTYPE html>
<html>
    <head>
        <title>Coffee and Facts</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link href="style.css" rel="stylesheet">
    </head>
    <body>

        <header>
            <div class="container">
                <h1>Coffee & Facts</h1>
            </div>
        </header>

        <div class="container">
            <div class="card">
                <h2>Take some Facts...</h2>
                <button id="fact-button" class="btn btn-coffee">Get Random Fact</button>
                <p class="fact"></p>
            </div>

            <div class="card">
                <h2>With your coffee!</h2>
                <button id="coffee-button" class="btn btn-coffee">Get Coffee Pic</button>
                <img class="coffee-img" src="" alt="Random coffee">
            </div>

        </div>

        <footer>
            
        </footer>

        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
        <script src="script.js"></script>
    </body>
</html>
